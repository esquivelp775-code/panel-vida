# Despliegue autocontenido (servidor Debian doméstico). Requiere un archivo .env en la raíz:
#   POSTGRES_PASSWORD=...  PANEL_SECRET_KEY=...  PANEL_CORS_ORIGINS=https://tu-dominio
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: panel_vida
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel_vida"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PANEL_ENV: production
      PANEL_DATABASE_URL: postgresql+psycopg://panel:${POSTGRES_PASSWORD}@db:5432/panel_vida
      PANEL_SECRET_KEY: ${PANEL_SECRET_KEY:?define PANEL_SECRET_KEY en .env}
      PANEL_CORS_ORIGINS: ${PANEL_CORS_ORIGINS:-http://localhost:8080}
      # La API sólo es alcanzable desde la red interna (nginx), por eso se confía en sus X-Forwarded-For.
      PANEL_FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"
    volumes:
      - ./frontend/out:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
